<section id="registro-form" class="form-section hidden">
                <h2 class="text-2xl font-semibold mb-6 text-blue-800 flex items-center">
                    <i class="fas fa-heartbeat mr-3"></i> Registro de Saúde
                </h2>
                <form id="registroForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="paciente_select" class="block text-sm font-medium text-gray-700">Paciente*</label>
                            <select id="paciente_select" name="paciente_select" required
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                                <option value="" disabled selected>Selecione um paciente</option>
                                <!-- Populated by JavaScript -->
                            </select>
                        </div>

                        <div>
                            <label for="registro_telefone" class="block text-sm font-medium text-gray-700">Telefone*</label>
                            <input type="text" id="registro_telefone" name="registro_telefone" maxlength="20" required
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border"
                                placeholder="(00) 00000-0000">
                            <p class="error-message hidden" id="registro_telefone-error"></p>
                        </div>

                        <div>
                            <label for="peso" class="block text-sm font-medium text-gray-700">Peso (kg)*</label>
                            <input type="number" id="peso" name="peso" step="0.01" min="0" max="999.99" required
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                            <p class="error-message hidden" id="peso-error"></p>
                        </div>

                        <div>
                            <label for="pressao_arterial" class="block text-sm font-medium text-gray-700">Pressão Arterial*</label>
                            <select id="pressao_arterial" name="pressao_arterial" required
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                                <option value="Normal" selected>Normal</option>
                                <option value="Baixa">Baixa</option>
                                <option value="Alta">Alta</option>
                                <option value="Muito Alta">Muito Alta</option>
                            </select>
                        </div>

                        <div>
                            <label for="nivel_atividade" class="block text-sm font-medium text-gray-700">Nível de Atividade*</label>
                            <select id="nivel_atividade" name="nivel_atividade" required
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                                <option value="Leve" selected>Leve</option>
                                <option value="Moderada">Moderada</option>
                                <option value="Intensa">Intensa</option>
                            </select>
                        </div>

                        <div>
                            <label for="data_avaliacao" class="block text-sm font-medium text-gray-700">Data de Avaliação*</label>
                            <input type="date" id="data_avaliacao" name="data_avaliacao" required
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                            <p class="error-message hidden" id="data_avaliacao-error"></p>
                        </div>

                        <div>
                            <label for="data_retorno" class="block text-sm font-medium text-gray-700">Data de Retorno*</label>
                            <input type="date" id="data_retorno" name="data_retorno" required
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                            <p class="error-message hidden" id="data_retorno-error"></p>
                        </div>
                    </div>

                    <div class="flex justify-end space-x-4 pt-6">
                        <button type="reset" class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            Limpar
                        </button>
                        <button type="submit" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            <i class="fas fa-save mr-2"></i>Salvar
                        </button>
                    </div>
                </form>
            </section>
