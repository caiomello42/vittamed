<section id="medico-form" class="form-section hidden">
                <h2 class="text-2xl font-semibold mb-6 text-blue-800 flex items-center">
                    <i class="fas fa-user-md mr-3"></i> Cadastro de Médico
                </h2>
                <form id="medicoForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="medico_nome" class="block text-sm font-medium text-gray-700">Nome Completo*</label>
                            <input type="text" id="medico_nome" name="medico_nome" maxlength="100" required
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                            <p class="error-message hidden" id="medico_nome-error"></p>
                        </div>

                        <div>
                            <label for="especialidade" class="block text-sm font-medium text-gray-700">Especialidade*</label>
                            <select id="especialidade" name="especialidade" required
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                                <option value="Cardiologista" selected>Cardiologista</option>
                                <option value="Dentista">Dentista</option>
                                <option value="Geriatra">Geriatra</option>
                                <option value="Ginecologista">Ginecologista</option>
                                <option value="Neurologista">Neurologista</option>
                                <option value="Ortopedista">Ortopedista</option>
                                <option value="Pediatra">Pediatra</option>
                            </select>
                        </div>

                        <div>
                            <label for="crm" class="block text-sm font-medium text-gray-700">CRM*</label>
                            <input type="text" id="crm" name="crm" maxlength="6" required
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                            <p class="error-message hidden" id="crm-error"></p>
                        </div>

                        <div>
                            <label for="medico_telefone" class="block text-sm font-medium text-gray-700">Telefone*</label>
                            <input type="text" id="medico_telefone" name="medico_telefone" maxlength="20" required
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border"
                                placeholder="(00) 00000-0000">
                            <p class="error-message hidden" id="medico_telefone-error"></p>
                        </div>

                        <div>
                            <label for="medico_email" class="block text-sm font-medium text-gray-700">Email*</label>
                            <input type="email" id="medico_email" name="medico_email" maxlength="100" required
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                            <p class="error-message hidden" id="medico_email-error"></p>
                        </div>
                    </div>

                    <div class="flex justify-end space-x-4 pt-6">
                        <button type="reset" class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            Limpar
                        </button>
                        <button type="submit" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            <i class="fas fa-save mr-2"></i>Salvar
                        </button>
                    </div>
                </form>
            </section>
