<section id="paciente-form" class="form-section active">
                <h2 class="text-2xl font-semibold mb-6 text-blue-800 flex items-center">
                    <i class="fas fa-user-injured mr-3"></i> Cadastro de Paciente
                </h2>
                <form id="pacienteForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="nome" class="block text-sm font-medium text-gray-700">Nome Completo*</label>
                            <input type="text" id="nome" name="nome" maxlength="100" required
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                            <p class="error-message hidden" id="nome-error"></p>
                        </div>

                        <div>
                            <label for="cpf" class="block text-sm font-medium text-gray-700">CPF*</label>
                            <input type="text" id="cpf" name="cpf" maxlength="11" required
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border"
                                placeholder="Somente números">
                            <p class="error-message hidden" id="cpf-error"></p>
                        </div>

                        <div>
                            <label for="data_nascimento" class="block text-sm font-medium text-gray-700">Data de Nascimento*</label>
                            <input type="date" id="data_nascimento" name="data_nascimento" required
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                            <p class="error-message hidden" id="data_nascimento-error"></p>
                        </div>

                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700">Email*</label>
                            <input type="email" id="email" name="email" required
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                            <p class="error-message hidden" id="email-error"></p>
                        </div>

                        <div>
                            <label for="telefone" class="block text-sm font-medium text-gray-700">Telefone*</label>
                            <input type="text" id="telefone" name="telefone" maxlength="20" required
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border"
                                placeholder="(00) 00000-0000">
                            <p class="error-message hidden" id="telefone-error"></p>
                        </div>
                    </div>

                    <div class="flex justify-end space-x-4 pt-6">
                        <button type="reset" class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            Limpar
                        </button>
                        <button type="submit" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            <i class="fas fa-save mr-2"></i>Salvar
                        </button>
                    </div>
                </form>
            </section>
