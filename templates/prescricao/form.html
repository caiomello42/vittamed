<section id="prescricao-form" class="form-section hidden">
                <h2 class="text-2xl font-semibold mb-6 text-blue-800 flex items-center">
                    <i class="fas fa-prescription-bottle-alt mr-3"></i> Prescrição Médica
                </h2>
                <form id="prescricaoForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="consulta_select" class="block text-sm font-medium text-gray-700">Consulta*</label>
                            <select id="consulta_select" name="consulta_select" required
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                                <option value="" disabled selected>Selecione uma consulta</option>
                                <!-- Populated by JavaScript -->
                            </select>
                        </div>

                        <div>
                            <label for="data_prescricao" class="block text-sm font-medium text-gray-700">Data da Prescrição*</label>
                            <input type="date" id="data_prescricao" name="data_prescricao" required
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                            <p class="error-message hidden" id="data_prescricao-error"></p>
                        </div>
                    </div>

                    <div>
                        <label for="descricao" class="block text-sm font-medium text-gray-700">Descrição*</label>
                        <textarea id="descricao" name="descricao" rows="5" required
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border"></textarea>
                        <p class="error-message hidden" id="descricao-error"></p>
                    </div>

                    <div class="flex justify-end space-x-4 pt-6">
                        <button type="reset" class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            Limpar
                        </button>
                        <button type="submit" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            <i class="fas fa-save mr-2"></i>Salvar
                        </button>
                    </div>
                </form>
            </section>
